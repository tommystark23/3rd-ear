<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3rd Ear">
<title>3rd Ear</title>
<link rel="manifest" href="manifest.json">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
    --blue: #3b82f6; --red: #ef4444; --green: #22c55e;
    --text: #f1f5f9; --text2: #94a3b8; --border: #334155;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; }
  .header { padding: 16px 20px 8px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .header .ear { font-size: 28px; }
  .tab-content { flex: 1; overflow-y: auto; padding: 0 0 80px; }
  .page { display: none; padding: 20px; }
  .page.active { display: block; }
  .nav { display: flex; background: var(--bg2); border-top: 1px solid var(--border); position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 16px; background: none; border: none; color: var(--text2); font-size: 10px; font-weight: 500; cursor: pointer; transition: color .2s; }
  .nav-btn.active { color: var(--blue); }
  .nav-btn svg { width: 24px; height: 24px; }
  .record-center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 32px; }
  .mic-btn { width: 120px; height: 120px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .3s; }
  .mic-btn.idle { background: var(--blue); }
  .mic-btn.recording { background: var(--red); animation: pulse 1.5s infinite; }
  .mic-btn.processing { background: var(--bg3); cursor: not-allowed; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); } 70% { box-shadow: 0 0 0 20px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
  .mic-btn svg { width: 48px; height: 48px; }
  .record-status { font-size: 16px; color: var(--text2); text-align: center; min-height: 24px; }
  .record-timer { font-size: 40px; font-weight: 200; letter-spacing: 2px; color: var(--red); min-height: 48px; }
  .title-input { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; color: var(--text); font-size: 15px; outline: none; }
  .title-input:focus { border-color: var(--blue); }
  .section-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .session-list { display: flex; flex-direction: column; gap: 8px; }
  .session-card { background: var(--bg2); border-radius: 14px; padding: 16px; cursor: pointer; transition: background .2s; border: 1px solid var(--border); }
  .session-card:active { background: var(--bg3); }
  .session-card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .session-card-meta { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 8px; }
  .badge { background: var(--blue); color: white; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
  .empty-state .icon { font-size: 60px; margin-bottom: 16px; }
  .empty-state p { font-size: 15px; line-height: 1.5; }
  .detail-view { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 100; flex-direction: column; max-width: 480px; margin: 0 auto; }
  .detail-view.open { display: flex; }
  .detail-header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .back-btn { background: none; border: none; color: var(--blue); font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .detail-title { font-size: 16px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg-control { display: flex; background: var(--bg3); border-radius: 10px; padding: 3px; margin: 16px 20px; }
  .seg-btn { flex: 1; padding: 7px; border-radius: 8px; border: none; background: none; color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .2s; }
  .seg-btn.active { background: var(--bg2); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .detail-body { flex: 1; overflow-y: auto; padding: 0 20px 20px; }
  .wiki-content { font-size: 15px; line-height: 1.7; color: var(--text); white-space: pre-wrap; }
  .detail-footer { padding: 16px 20px; padding-bottom: max(16px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
  .export-btn { width: 100%; padding: 14px; background: var(--blue); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity .2s; }
  .export-btn:disabled { opacity: .5; cursor: not-allowed; }
  .settings-group { background: var(--bg2); border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
  .settings-row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); gap: 12px; }
  .settings-row:last-child { border-bottom: none; }
  .settings-row label { font-size: 14px; color: var(--text2); min-width: 90px; flex-shrink: 0; }
  .settings-row input, .settings-row textarea { flex: 1; background: none; border: none; color: var(--text); font-size: 15px; outline: none; }
  .settings-row textarea { resize: none; min-height: 60px; padding-top: 2px; }
  .eye-btn { background: none; border: none; color: var(--text2); cursor: pointer; padding: 4px; }
  .check { color: var(--green); font-size: 16px; }
  .settings-hint { font-size: 12px; color: var(--text2); margin-top: -12px; margin-bottom: 20px; padding: 0 4px; line-height: 1.5; }
  .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid var(--border); color: var(--text); padding: 12px 20px; border-radius: 12px; font-size: 14px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--red); color: #fca5a5; }
  .toast.success { border-color: var(--green); color: #86efac; }
</style>
</head>
<body>
<div id="app">
  <div class="header"><h1>3rd Ear</h1><span class="ear">🐕</span></div>
  <div class="tab-content">
    <div id="page-record" class="page active">
      <div class="record-center">
        <div class="record-timer" id="timer"></div>
        <button class="mic-btn idle" id="micBtn" onclick="toggleRecord()">
          <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <div class="record-status" id="statusMsg">Tap to start recording</div>
        <input class="title-input" id="sessionTitleInput" placeholder="Session title" style="display:none">
      </div>
    </div>
    <div id="page-wiki" class="page">
      <div class="section-title">Training Sessions</div>
      <div id="sessionList" class="session-list"></div>
      <div id="emptyState" class="empty-state" style="display:none">
        <div class="icon">📖</div>
        <p>No sessions yet.<br>Record a training session<br>to build your wiki.</p>
      </div>
    </div>
    <div id="page-settings" class="page">
      <div class="section-title">Profile</div>
      <div class="settings-group">
        <div class="settings-row"><label>Dog's Name</label><input type="text" id="dogName" placeholder="e.g. Bella" oninput="saveSetting('dogName',this.value)"></div>
        <div class="settings-row"><label>Your Name</label><input type="text" id="trainerName" placeholder="e.g. Tommy" oninput="saveSetting('trainerName',this.value)"></div>
        <div class="settings-row" style="align-items:flex-start"><label style="padding-top:2px">Goals</label><textarea id="trainingGoals" placeholder="What are you working on?" oninput="saveSetting('trainingGoals',this.value)"></textarea></div>
      </div>
      <div class="section-title">Integrations</div>
      <div class="settings-group">
        <div class="settings-row"><label>Claude Key</label><input type="password" id="anthropicKey" placeholder="sk-ant-..." oninput="saveSetting('anthropicKey',this.value)"><button class="eye-btn" onclick="toggleVis('anthropicKey')">👁</button><span id="anthropicCheck" class="check" style="display:none">✓</span></div>
        <div class="settings-row"><label>Drive Token</label><input type="password" id="driveToken" placeholder="ya29..." oninput="saveSetting('driveToken',this.value)"><button class="eye-btn" onclick="toggleVis('driveToken')">👁</button><span id="driveCheck" class="check" style="display:none">✓</span></div>
      </div>
      <p class="settings-hint">Claude API key: get one free at console.anthropic.com</p>
      <p class="settings-hint">Google Drive token: optional. Generate at developers.google.com/oauthplayground</p>
    </div>
  </div>
  <nav class="nav">
    <button class="nav-btn active" id="nav-record" onclick="showPage('record')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>Record</button>
    <button class="nav-btn" id="nav-wiki" onclick="showPage('wiki')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Wiki</button>
    <button class="nav-btn" id="nav-settings" onclick="showPage('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</button>
  </nav>
</div>
<div class="detail-view" id="detailView">
  <div class="detail-header"><button class="back-btn" onclick="closeDetail()">‹ Back</button><div class="detail-title" id="detailTitle"></div></div>
  <div class="seg-control"><button class="seg-btn active" id="seg-wiki" onclick="showSeg('wiki')">Wiki Entry</button><button class="seg-btn" id="seg-transcript" onclick="showSeg('transcript')">Transcript</button></div>
  <div class="detail-body"><div id="detailWiki" class="wiki-content"></div><div id="detailTranscript" class="wiki-content" style="display:none"></div></div>
  <div class="detail-footer"><button class="export-btn" id="exportBtn" onclick="exportToDrive()">↑ Export to Google Drive</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
let isRecording=false,mediaRecorder=null,audioChunks=[],timerInterval=null,timerSec=0,recognition=null,liveTranscript='',currentSession=null;
function saveSetting(k,v){localStorage.setItem(k,v);updateChecks();}
function getSetting(k,d=''){return localStorage.getItem(k)||d;}
function loadSettings(){document.getElementById('dogName').value=getSetting('dogName');document.getElementById('trainerName').value=getSetting('trainerName');document.getElementById('trainingGoals').value=getSetting('trainingGoals');document.getElementById('anthropicKey').value=getSetting('anthropicKey');document.getElementById('driveToken').value=getSetting('driveToken');updateChecks();}
function updateChecks(){document.getElementById('anthropicCheck').style.display=getSetting('anthropicKey')?'inline':'none';document.getElementById('driveCheck').style.display=getSetting('driveToken')?'inline':'none';}
function toggleVis(id){const el=document.getElementById(id);el.type=el.type==='password'?'text':'password';}
function showPage(page){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById('page-'+page).classList.add('active');document.getElementById('nav-'+page).classList.add('active');if(page==='wiki')renderWiki();}
async function toggleRecord(){if(isRecording){stopRecording();}else{await startRecording();}}
async function startRecording(){try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];liveTranscript='';mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);mediaRecorder.start(100);const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.continuous=true;recognition.interimResults=true;recognition.lang='en-US';let ft='';recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)ft+=e.results[i][0].transcript+' ';else interim+=e.results[i][0].transcript;}liveTranscript=ft+interim;};recognition.onerror=()=>{};recognition.start();}isRecording=true;timerSec=0;timerInterval=setInterval(()=>{timerSec++;const m=String(Math.floor(timerSec/60)).padStart(2,'0');const s=String(timerSec%60).padStart(2,'0');document.getElementById('timer').textContent=m+':'+s;},1000);document.getElementById('micBtn').className='mic-btn recording';document.getElementById('statusMsg').textContent='Recording... speak naturally';document.getElementById('sessionTitleInput').style.display='none';}catch(e){showToast('Microphone access required. Check Safari Settings > Websites > Microphone.','error');}}
function stopRecording(){isRecording=false;clearInterval(timerInterval);if(recognition){try{recognition.stop();}catch(e){}}if(mediaRecorder){mediaRecorder.stop();mediaRecorder.stream.getTracks().forEach(t=>t.stop());}document.getElementById('micBtn').className='mic-btn processing';document.getElementById('statusMsg').textContent='Processing...';const now=new Date();const title=`Session — ${now.toLocaleDateString('en-US',{month:'short',day:'numeric'})} at ${now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`;document.getElementById('sessionTitleInput').value=title;document.getElementById('sessionTitleInput').style.display='block';setTimeout(()=>processSession(title),800);}
async function processSession(title){const transcript=liveTranscript.trim()||'(No transcript captured)';const apiKey=getSetting('anthropicKey');let wikiEntry='';if(apiKey){document.getElementById('statusMsg').textContent='Claude is writing your wiki entry...';try{wikiEntry=await generateWiki(transcript,apiKey);}catch(e){console.error(e);}}const customTitle=document.getElementById('sessionTitleInput').value.trim()||title;saveSession({id:Date.now(),title:customTitle,date:new Date().toISOString(),transcript,wikiEntry});document.getElementById('micBtn').className='mic-btn idle';document.getElementById('statusMsg').textContent='';document.getElementById('timer').textContent='';document.getElementById('sessionTitleInput').style.display='none';showToast('Session saved to Wiki ✓','success');}
async function generateWiki(transcript,apiKey){const dog=getSetting('dogName','the dog');const trainer=getSetting('trainerName','the trainer');const goals=getSetting('trainingGoals','');const prompt=`You are a professional dog training assistant for ${trainer}. Analyze this training session transcript.\n\nDog: ${dog}\n${goals?'Training goals: '+goals:''}\n\nTranscript:\n${transcript}\n\nWrite a wiki entry:\n📋 SESSION SUMMARY\n[2-3 sentences]\n\n🎯 COMMANDS PRACTICED\n[bullet list]\n\n🐕 DOG'S RESPONSE\n[how dog responded]\n\n📝 TRAINER NOTES\n[recommendations for next session]`;const body=JSON.stringify({model:'claude-sonnet-4-6',max_tokens:800,messages:[{role:'user',content:prompt}]});let response;try{response=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body});}catch(e){response=await fetch('https://corsproxy.io/?url=https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},body});}if(!response.ok){if(response.status===401)throw new Error('Invalid API key');throw new Error('Error '+response.status);}const data=await response.json();return data.content[0].text;}
function saveSession(s){const sessions=getSessions();sessions.unshift(s);localStorage.setItem('sessions',JSON.stringify(sessions));}
function getSessions(){try{return JSON.parse(localStorage.getItem('sessions')||'[]');}catch(e){return[];}}
function renderWiki(){const sessions=getSessions();const list=document.getElementById('sessionList');const empty=document.getElementById('emptyState');if(!sessions.length){list.style.display='none';empty.style.display='block';return;}list.style.display='flex';empty.style.display='none';list.innerHTML=sessions.map((s,i)=>`<div class="session-card" onclick="openDetail(${i})"><div class="session-card-title">${escHtml(s.title)}</div><div class="session-card-meta"><span>${new Date(s.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>${s.wikiEntry?'<span class="badge">WIKI</span>':''}</div></div>`).join('');}
function openDetail(idx){const session=getSessions()[idx];currentSession=session;document.getElementById('detailTitle').textContent=session.title;document.getElementById('detailWiki').textContent=session.wikiEntry||'(No wiki entry — add Claude API key in Settings)';document.getElementById('detailTranscript').textContent=session.transcript||'(No transcript)';showSeg('wiki');document.getElementById('detailView').classList.add('open');}
function closeDetail(){document.getElementById('detailView').classList.remove('open');currentSession=null;}
function showSeg(seg){document.getElementById('detailWiki').style.display=seg==='wiki'?'block':'none';document.getElementById('detailTranscript').style.display=seg==='transcript'?'block':'none';document.getElementById('seg-wiki').classList.toggle('active',seg==='wiki');document.getElementById('seg-transcript').classList.toggle('active',seg==='transcript');}
async function exportToDrive(){const token=getSetting('driveToken');if(!token){showToast('Add Google Drive token in Settings','error');return;}if(!currentSession)return;const btn=document.getElementById('exportBtn');btn.disabled=true;btn.textContent='Exporting...';const content=`3rd Ear Training Session\n${'='.repeat(40)}\nTitle: ${currentSession.title}\nDate: ${new Date(currentSession.date).toLocaleString()}\n\nWIKI ENTRY\n${'-'.repeat(20)}\n${currentSession.wikiEntry||'(none)'}\n\nTRANSCRIPT\n${'-'.repeat(20)}\n${currentSession.transcript||'(none)'}`;const boundary='boundary_'+Date.now();const meta=JSON.stringify({name:currentSession.title.replace(/[^a-zA-Z0-9 _-]/g,'')+'.txt',mimeType:'text/plain'});let body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: text/plain\r\n\r\n${content}\r\n--${boundary}--`;try{const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'multipart/related; boundary='+boundary},body});if(res.status===401)throw new Error('Token expired');if(!res.ok)throw new Error('Drive error '+res.status);showToast('Saved to Google Drive ✓','success');}catch(e){showToast(e.message,'error');}btn.disabled=false;btn.textContent='↑ Export to Google Drive';}
function showToast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type?' '+type:'');setTimeout(()=>t.className='toast',3000);}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
loadSettings();
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{});}
</script>
</body>
</html>
